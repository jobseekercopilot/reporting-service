spring:
  application:
    name: reporting-service

server:
  port: ${SERVER_PORT:8096}

services:
  application-tracker-service:
    base-url: ${APPLICATION_TRACKER_SERVICE_BASE_URL:http://application-tracker-service:8088}
  user-profile-service:
    base-url: ${USER_PROFILE_SERVICE_URL:http://user-profile-service:8085}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%X{serviceName}] [%thread] %logger{36} - %msg%n"
  level:
    com.jobseekercopilot: ${APP_LOG_LEVEL:INFO}
